<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa6ff"/>
      <stop offset="0.5" stop-color="#2461e6"/>
      <stop offset="1" stop-color="#0b2a86"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.25" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e5ff"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb6ff"/>
      <stop offset="1" stop-color="#173f9e"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#021046" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#gloss)"/>
  <rect x="19" y="19" width="474" height="474" rx="113" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <g filter="url(#sh)" fill="url(#white)">
    <!-- дальнее крыло: к верхнему левому углу -->
    <path d="M218 266 L74 98 C66 88 74 78 86 86 L258 248 Z"/>
    <!-- хвостовая балка -->
    <path d="M232 260 C280 254 340 248 392 243 L396 260 C340 268 282 278 236 288 Z"/>
    <!-- киль -->
    <path d="M376 254 L396 192 L418 192 L408 260 Z"/>
    <!-- стабилизатор наверху киля -->
    <path d="M382 186 L456 218 C462 221 460 231 453 229 L378 202 Z"/>
    <!-- кабина-капля -->
    <path d="M118 292 C118 268 152 254 196 252 C226 251 250 258 256 272 C258 284 238 296 206 300 C168 306 124 308 118 292 Z"/>
    <!-- ближнее крыло: к нижнему правому углу, длиннее -->
    <path d="M214 284 L256 262 L446 424 C458 434 450 450 436 442 Z"/>
  </g>
  <!-- фонарь кабины -->
  <path d="M146 274 C154 262 184 257 206 258 C222 259 229 266 222 273 C211 280 186 284 164 284 C150 284 142 280 146 274 Z" fill="url(#canopy)"/>
  <path d="M160 267 C174 262 192 261 206 262" stroke="#fff" stroke-opacity=".7" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
